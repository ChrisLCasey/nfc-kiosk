<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Kiosk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw; height: 100vh;
    overflow: hidden; cursor: none;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  /* VIDEO LAYERS */
  .video-layer {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    transition: opacity 600ms ease;
  }
  .video-layer iframe { width:100%; height:100%; border:none; display:block; }
  #holding-layer { z-index:1; opacity:1; }
  #demo-layer    { z-index:2; opacity:0; pointer-events:none; }

  /* TAP PROMPT */
  #prompt {
    position:fixed; bottom:48px; left:50%;
    transform:translateX(-50%); z-index:10;
    display:flex; align-items:center; gap:14px;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15); border-radius:50px;
    padding:14px 28px; color:#fff;
    font-size:15px; letter-spacing:0.08em; text-transform:uppercase;
    opacity:1; transition:opacity 400ms ease; pointer-events:none;
  }
  #prompt.hidden { opacity:0; }
  .nfc-icon { width:22px; height:22px; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.45; transform:scale(0.85); }
  }

  /* FLASH */
  #flash {
    position:fixed; inset:0; z-index:20;
    background:rgba(255,255,255,0.15);
    opacity:0; pointer-events:none; transition:opacity 200ms ease;
  }
  #flash.active { opacity:1; }

  /* STATUS DOT */
  #status {
    position:fixed; top:16px; right:20px; z-index:30;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:rgba(255,255,255,0.3);
    display:flex; align-items:center; gap:6px; pointer-events:none;
  }
  #status-dot {
    width:6px; height:6px; border-radius:50%;
    background:#666; transition:background 300ms;
  }
  #status-dot.connected    { background:#4ade80; }
  #status-dot.disconnected { background:#f87171; }
</style>
</head>
<body>

<div class="video-layer" id="holding-layer">
  <iframe id="holding-iframe" src="" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" allowfullscreen></iframe>
</div>

<div class="video-layer" id="demo-layer">
  <iframe id="demo-iframe" src="" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" allowfullscreen></iframe>
</div>

<div id="prompt">
  <svg class="nfc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-opacity="0.4"/>
    <path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4"/>
    <path d="M12 11v2l1 1"/>
  </svg>
  Tap a card to play a demo
</div>

<div id="flash"></div>

<div id="status">
  <div id="status-dot"></div>
  <span id="status-text">Connecting to reader…</span>
</div>

<script>
// ================================================================
//  CONFIGURATION — only edit these two lines
// ================================================================
const HOLDING_VIDEO_ID   = "1019710515";
const HOLDING_VIDEO_HASH = "c2b4244e58";
const RETURN_DELAY       = 2; // seconds after demo ends before returning to holding
const WS_PORT            = 8765; // must match nfc_bridge.py

// ================================================================
//  VIMEO PLAYER
// ================================================================
function vimeoSrc(id, opts={}, hash=null) {
  const p = new URLSearchParams({
    autoplay:1, loop:0, title:0, byline:0,
    portrait:0, controls:0, muted:0, ...opts
  });
  if (hash) p.set("h", hash);
  return `https://player.vimeo.com/video/${id}?${p}`;
}

function vimeoId(url) {
  const m = url.match(/vimeo\.com(?:\/video)?\/(?:channels\/\w+\/)?(\d+)/);
  return m ? m[1] : null;
}

function vimeoHash(url) {
  // Extracts the unlisted hash e.g. c2b4244e58 from https://vimeo.com/123456/c2b4244e58
  const m = url.match(/vimeo\.com\/\d+\/([a-f0-9]+)/);
  return m ? m[1] : null;
}

const holdingIframe = document.getElementById("holding-iframe");
const demoIframe    = document.getElementById("demo-iframe");
const demoLayer     = document.getElementById("demo-layer");
const prompt        = document.getElementById("prompt");
const flash         = document.getElementById("flash");
const statusDot     = document.getElementById("status-dot");
const statusText    = document.getElementById("status-text");

// Load holding video immediately
holdingIframe.src = `https://player.vimeo.com/video/${HOLDING_VIDEO_ID}?h=${HOLDING_VIDEO_HASH}&badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&loop=1&title=0&byline=0&portrait=0`;

let returnTimer = null;
let isDemoPlaying = false;

function playDemo(url) {
  const id   = vimeoId(url);
  const hash = vimeoHash(url);
  if (!id) { console.warn("Couldn't extract Vimeo ID from:", url); return; }

  clearTimeout(returnTimer);
  isDemoPlaying = true;

  // Flash feedback
  flash.classList.add("active");
  setTimeout(() => flash.classList.remove("active"), 300);

  prompt.classList.add("hidden");
  demoIframe.src = `https://player.vimeo.com/video/${id}?${hash ? "h="+hash+"&" : ""}badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&title=0&byline=0&portrait=0`;
  demoLayer.style.opacity = "1";
  demoLayer.style.pointerEvents = "auto";
  console.log("Playing:", id);
}

function returnToHolding() {
  isDemoPlaying = false;
  demoLayer.style.opacity = "0";
  demoLayer.style.pointerEvents = "none";
  setTimeout(() => {
    demoIframe.src = "";
    prompt.classList.remove("hidden");
  }, 700);
}

// Vimeo finish event
window.addEventListener("message", e => {
  if (!e.origin.includes("vimeo.com")) return;
  let d; try { d = JSON.parse(e.data); } catch { return; }
  if (d.event === "finish" && isDemoPlaying)
    returnTimer = setTimeout(returnToHolding, RETURN_DELAY * 1000);
  if (d.event === "ready")
    demoIframe.contentWindow?.postMessage(
      JSON.stringify({ method: "addEventListener", value: "finish" }),
      "https://player.vimeo.com"
    );
});

// ================================================================
//  WEBSOCKET — receives URLs from nfc_bridge.py
// ================================================================
function setStatus(cls, label) {
  statusDot.className = cls;
  statusText.textContent = label;
}

function connectWS() {
  const ws = new WebSocket(`ws://localhost:${WS_PORT}`);

  ws.onopen = () => {
    setStatus("connected", "Reader ready");
    console.log("Connected to NFC bridge.");
  };

  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "play" && msg.url) {
        console.log("Tag URL:", msg.url);
        playDemo(msg.url);
      }
    } catch(err) {
      console.error("Bad message:", err);
    }
  };

  ws.onclose = () => {
    setStatus("disconnected", "Reader disconnected — is nfc_bridge.py running?");
    setTimeout(connectWS, 3000); // retry every 3 seconds
  };

  ws.onerror = () => ws.close();
}

connectWS();
</script>
</body>
</html>
